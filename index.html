<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 — 나만의 칸반보드</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><header><div class="brand"><span>m</span>모아 <small class="brand-subtitle">나의 작은 작업 공간</small></div><div class="local">Supabase · 개인 보드</div></header><main><section class="auth" aria-label="로그인"><form id="authForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary" type="submit">로그인</button><button type="button" id="signup">회원가입</button></form><div id="account" hidden><span id="accountEmail"></span> <button id="reload">새로고침</button> <button id="logout">로그아웃</button></div><p id="authMessage" role="status">연결 설정을 확인하는 중입니다.</p></section><div class="heading"><div><div class="eyebrow">MY WORKSPACE</div><h1>차근차근, 하나씩.</h1><p>머릿속 할 일을 꺼내고, 나만의 속도로 완성하세요.</p></div><button class="primary" id="newTask">＋ 새 할 일</button></div><div class="stats"><div class="stat"><span>전체 할 일</span><strong id="total">0</strong></div><div class="stat"><span>진행 중</span><strong id="progress">0</strong></div><div class="stat"><span>완료율</span><strong id="rate">0%</strong></div></div><div class="toolbar"><div class="filters"><input id="search" type="search" placeholder="할 일 검색…" aria-label="할 일 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="">모든 우선순위</option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></div><div class="actions"><button id="exportBtn">백업 내보내기</button><button id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div><section class="board" aria-label="칸반보드"><section class="column todo" data-status="todo"><div class="column-head"><h2><span class="dot"></span>할 일 <span class="count" id="count-todo">0</span></h2><button class="small" data-add="todo" aria-label="할 일에 추가">＋</button></div><div class="cards" id="cards-todo"></div></section><section class="column doing" data-status="doing"><div class="column-head"><h2><span class="dot"></span>진행 중 <span class="count" id="count-doing">0</span></h2><button class="small" data-add="doing" aria-label="진행 중에 추가">＋</button></div><div class="cards" id="cards-doing"></div></section><section class="column done" data-status="done"><div class="column-head"><h2><span class="dot"></span>완료 <span class="count" id="count-done">0</span></h2><button class="small" data-add="done" aria-label="완료에 추가">＋</button></div><div class="cards" id="cards-done"></div></section></section><p class="hint">카드를 끌어서 다른 열로 옮기거나, 카드 아래의 상태 메뉴를 사용하세요. 각 열에서는 최신 항목이 위에 표시됩니다.</p><footer><span id="saveState" role="status">로그인 후 Supabase에서 불러옵니다.</span><span>카드는 Supabase에 저장됩니다. 로그인 정보는 메모리에만 유지됩니다.</span></footer></main></div><dialog id="editor"><form id="taskForm"><h2 id="modalTitle">새 할 일</h2><label>제목 *<input id="titleInput" required maxlength="150" placeholder="어떤 일을 해볼까요?"></label><label>메모<textarea id="descriptionInput" maxlength="5000" placeholder="작업 내용이나 참고할 내용을 적어주세요."></textarea></label><div class="row"><label>상태<select id="statusInput"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></label><label>우선순위<select id="priorityInput"><option value="low">낮음</option><option value="medium" selected>보통</option><option value="high">높음</option></select></label></div><label>마감일<input type="date" id="dueInput" min="1900-01-01" max="9999-12-31"></label><div class="dialog-actions"><button type="button" class="danger" id="deleteBtn">삭제</button><button type="button" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script></body></html>

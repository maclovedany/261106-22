<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 — 나만의 칸반보드</title><style>
:root{--bg:#f6f7f9;--ink:#202735;--muted:#687385;--line:#e2e6ec;--accent:#5653db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;color:var(--ink)}button:hover{background:#f0f0ff;border-color:#bebcf1}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #aaa7f4;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#4542bd;color:white}.app{max-width:1500px;margin:auto;padding:0 38px}header{height:85px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{display:inline-grid;place-items:center;background:var(--accent);color:white;border-radius:10px;width:34px;height:34px;margin-right:10px;font-size:20px}.local{color:var(--muted);font-size:12px}.local:before{content:'●';color:#248363;margin-right:7px}main{padding:40px 0}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--accent)}h1{font-size:32px;letter-spacing:-1.4px;margin:7px 0}p{margin:0;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px}.stats{display:flex;gap:10px;margin:27px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 20px;min-width:145px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;line-height:1.4}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 20px}.filters,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}#search{width:260px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.column{background:#eceff3;border:1px solid #e5e8ee;border-radius:14px;padding:15px;min-height:390px}.column.over{outline:2px dashed var(--accent);background:#e8e7fc}.column-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 15px}.column-head h2{font-size:14px;margin:0;display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:#8490a2}.doing .dot{background:#7464e8}.done .dot{background:#27896a}.count{background:#dfe3e9;font-size:11px;padding:1px 7px;border-radius:6px;color:#505b6d}.small{padding:2px 9px;font-size:20px;background:transparent;border:0;color:#657084}.cards{min-height:210px}.card{background:white;border:1px solid #e0e4ec;border-radius:11px;padding:17px;margin-bottom:11px;box-shadow:0 2px 3px #27304404;cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.4}.card-top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;background:#f0f1f4;color:#596273}.tag.high{background:#fff0ee;color:#b34235}.tag.medium{background:#f1edff;color:#6750a6}.tag.low{background:#eaf5ef;color:#287254}.edit{font-size:17px;padding:0 7px;border:0;color:#6a7483}.card h3{font-size:15px;line-height:1.5;margin:12px 0 6px;overflow-wrap:anywhere}.desc{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:5px;border-top:1px solid #f0f1f4;padding-top:12px;margin-top:14px;color:var(--muted);font-size:11px}.late{color:#b34235}.card-foot select{font-size:11px;padding:3px 5px;max-width:110px}.empty{text-align:center;color:#747e8e;padding:55px 8px;font-size:12px}.hint{font-size:12px;margin-top:20px}footer{margin-top:35px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:14px}dialog{border:1px solid var(--line);border-radius:17px;padding:26px;width:min(500px,calc(100% - 28px));box-shadow:0 24px 90px #20273530}dialog::backdrop{background:#20273560}dialog h2{font-size:21px;margin:0 0 20px}label{display:block;font-size:12px;font-weight:650;margin-bottom:14px}label input,label textarea,label select{display:block;width:100%;margin-top:6px}textarea{resize:vertical;min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:23px}.danger{color:#b34235;margin-right:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#242b3b;color:white;padding:11px 20px;border-radius:10px;z-index:10;max-width:90vw}#toast:empty{display:none}@media(max-width:850px){.app{padding:0 20px}.board{gap:12px}.column{padding:10px}.toolbar{align-items:flex-start;flex-direction:column}.heading{align-items:flex-start}.stat{min-width:0;flex:1;padding:12px}.card{padding:12px}}@media(max-width:630px){header{height:70px}.local{font-size:10px}main{padding-top:26px}h1{font-size:26px}.heading{flex-direction:column}.board{grid-template-columns:1fr}.column{min-height:200px}.cards{min-height:90px}.empty{padding:24px}.stats{gap:7px}.stat strong{font-size:21px}.filters{width:100%}#search{flex:1;width:150px}.hint{display:none}footer{flex-direction:column}.actions button{font-size:12px}}
</style></head><body><div class="app"><header><div class="brand"><span>m</span>모아 <small style="font-size:11px;letter-spacing:0;color:#687385;font-weight:500;margin-left:10px">나의 작은 작업 공간</small></div><div class="local">로컬 전용 · 개인 보드</div></header><main><div class="heading"><div><div class="eyebrow">MY WORKSPACE</div><h1>차근차근, 하나씩.</h1><p>머릿속 할 일을 꺼내고, 나만의 속도로 완성하세요.</p></div><button class="primary" id="newTask">＋ 새 할 일</button></div><div class="stats"><div class="stat"><span>전체 할 일</span><strong id="total">0</strong></div><div class="stat"><span>진행 중</span><strong id="progress">0</strong></div><div class="stat"><span>완료율</span><strong id="rate">0%</strong></div></div><div class="toolbar"><div class="filters"><input id="search" type="search" placeholder="할 일 검색…" aria-label="할 일 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="">모든 우선순위</option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></div><div class="actions"><button id="exportBtn">백업 내보내기</button><button id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div><section class="board" aria-label="칸반보드"><section class="column todo" data-status="todo"><div class="column-head"><h2><span class="dot"></span>할 일 <span class="count" id="count-todo">0</span></h2><button class="small" data-add="todo" aria-label="할 일에 추가">＋</button></div><div class="cards" id="cards-todo"></div></section><section class="column doing" data-status="doing"><div class="column-head"><h2><span class="dot"></span>진행 중 <span class="count" id="count-doing">0</span></h2><button class="small" data-add="doing" aria-label="진행 중에 추가">＋</button></div><div class="cards" id="cards-doing"></div></section><section class="column done" data-status="done"><div class="column-head"><h2><span class="dot"></span>완료 <span class="count" id="count-done">0</span></h2><button class="small" data-add="done" aria-label="완료에 추가">＋</button></div><div class="cards" id="cards-done"></div></section></section><p class="hint">카드를 끌어서 다른 열로 옮기거나, 카드 아래의 상태 메뉴를 사용하세요. 각 열에서는 최신 항목이 위에 표시됩니다.</p><footer><span id="saveState" role="status">이 브라우저에 자동 저장됩니다.</span><span>데이터는 외부로 전송되지 않습니다. 주기적으로 백업해 주세요.</span></footer></main></div><dialog id="editor"><form id="taskForm"><h2 id="modalTitle">새 할 일</h2><label>제목 *<input id="titleInput" required maxlength="150" placeholder="어떤 일을 해볼까요?"></label><label>메모<textarea id="descriptionInput" maxlength="5000" placeholder="작업 내용이나 참고할 내용을 적어주세요."></textarea></label><div class="row"><label>상태<select id="statusInput"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></label><label>우선순위<select id="priorityInput"><option value="low">낮음</option><option value="medium" selected>보통</option><option value="high">높음</option></select></label></div><label>마감일<input type="date" id="dueInput" min="1900-01-01" max="9999-12-31"></label><div class="dialog-actions"><button type="button" class="danger" id="deleteBtn">삭제</button><button type="button" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const KEY='moa-kanban-v1',statuses=['todo','doing','done'],priorities=['low','medium','high'],names={todo:'할 일',doing:'진행 중',done:'완료',low:'낮음',medium:'보통',high:'높음'};
const $=id=>document.getElementById(id);let tasks=[],editing=null,dragged=null,timer;
function notify(text){$('toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',3500)}
function validDate(s){if(s==='')return true;if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function validate(data){if(!Array.isArray(data)||data.length>10000)throw Error('invalid');const ids=new Set();return data.map(t=>{if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||typeof t.title!=='string'||!t.title.trim()||t.title.length>150||typeof t.description!=='string'||t.description.length>5000||!statuses.includes(t.status)||!priorities.includes(t.priority)||typeof t.due!=='string'||!validDate(t.due))throw Error('invalid');ids.add(t.id);return{id:t.id,title:t.title.trim(),description:t.description,status:t.status,priority:t.priority,due:t.due}})}
try{const raw=localStorage.getItem(KEY);if(raw)tasks=validate(JSON.parse(raw))}catch(e){$('saveState').textContent='저장 데이터를 읽지 못했습니다. 백업 파일을 불러오거나 브라우저 설정을 확인해 주세요.';notify('저장 데이터 접근에 문제가 있습니다. 새 작업 전 백업을 확인해 주세요.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));$('saveState').textContent='자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});return true}catch(e){$('saveState').textContent='저장 실패 · 브라우저 저장 공간이나 권한을 확인하고 백업해 주세요.';notify('자동 저장에 실패했습니다. 백업을 내보내 주세요.');return false}}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),p=$('priorityFilter').value;const filtered=tasks.filter(t=>(!p||t.priority===p)&&(!q||(t.title+' '+t.description).toLocaleLowerCase().includes(q)));$('total').textContent=tasks.length;$('progress').textContent=tasks.filter(t=>t.status==='doing').length;$('rate').textContent=(tasks.length?Math.round(tasks.filter(t=>t.status==='done').length/tasks.length*100):0)+'%';for(const status of statuses){const list=$('cards-'+status);list.replaceChildren();const group=filtered.filter(t=>t.status===status);$('count-'+status).textContent=group.length;if(!group.length)list.append(element('div','empty',q||p?'조건에 맞는 할 일이 없어요.':status==='done'?'완료한 일이 여기에 쌓여요.':'새로운 할 일을 추가해 보세요.'));for(const t of group){const card=element('article','card');card.draggable=true;card.dataset.id=t.id;const top=element('div','card-top');top.append(element('span','tag '+t.priority,'우선순위 '+names[t.priority]));const edit=element('button','edit','⋯');edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openEditor(t.id);top.append(edit);card.append(top,element('h3','',t.title));if(t.description)card.append(element('p','desc',t.description));const foot=element('div','card-foot');foot.append(element('span',t.due&&t.due<today()&&status!=='done'?'late':'',t.due?(t.due<today()&&status!=='done'?'기한 지남 · ':'마감 · ')+t.due:'마감일 없음'));const select=element('select');select.setAttribute('aria-label',t.title+' 상태');statuses.forEach(s=>{const opt=element('option','',names[s]);opt.value=s;select.append(opt)});select.value=status;select.onchange=()=>move(t.id,select.value);foot.append(select);card.append(foot);card.ondragstart=e=>{if(e.target.closest('button,select')){e.preventDefault();return}dragged=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')};card.ondragend=()=>{dragged=null;card.classList.remove('dragging');document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'))};list.append(card)}}}
function move(id,status){const t=tasks.find(t=>t.id===id);if(!t||t.status===status)return;tasks=tasks.filter(t=>t.id!==id);t.status=status;tasks.unshift(t);save();render()}
function openEditor(id=null,status='todo'){editing=id;const t=tasks.find(t=>t.id===id);$('taskForm').reset();$('modalTitle').textContent=t?'할 일 수정':'새 할 일';$('titleInput').value=t?.title||'';$('descriptionInput').value=t?.description||'';$('statusInput').value=t?.status||status;$('priorityInput').value=t?.priority||'medium';$('dueInput').value=t?.due||'';$('deleteBtn').hidden=!t;$('editor').showModal();$('titleInput').focus()}
$('newTask').onclick=()=>openEditor();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openEditor(null,b.dataset.add));$('cancelBtn').onclick=()=>$('editor').close();$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('titleInput').value.trim();if(!title){$('titleInput').setCustomValidity('제목을 입력해 주세요.');$('titleInput').reportValidity();return}const t={id:editing||('task-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),title,description:$('descriptionInput').value,status:$('statusInput').value,priority:$('priorityInput').value,due:$('dueInput').value};if(!validDate(t.due)){notify('올바른 마감일을 입력해 주세요.');return}if(editing)tasks=tasks.map(x=>x.id===editing?t:x);else tasks.unshift(t);save();render();$('editor').close()};$('titleInput').oninput=()=>$('titleInput').setCustomValidity('');$('deleteBtn').onclick=()=>{if(confirm('이 할 일을 삭제할까요?')){tasks=tasks.filter(t=>t.id!==editing);save();render();$('editor').close()}};
$('search').oninput=render;$('priorityFilter').onchange=render;
document.querySelectorAll('.column').forEach(c=>{c.ondragover=e=>{if(!dragged)return;e.preventDefault();e.dataTransfer.dropEffect='move';c.classList.add('over')};c.ondragleave=e=>{if(!c.contains(e.relatedTarget))c.classList.remove('over')};c.ondrop=e=>{e.preventDefault();c.classList.remove('over');if(dragged)move(dragged,c.dataset.status);dragged=null}});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moa-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 내보냈습니다.')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('large');const data=JSON.parse(await file.text());if(data.version!==1)throw Error('version');const imported=validate(data.tasks);if(confirm(`현재 할 일 ${tasks.length}개를 백업의 ${imported.length}개로 교체할까요? 현재 데이터는 먼저 내보내기를 권장합니다.`)){tasks=imported;const ok=save();render();if(ok)notify('백업을 불러왔습니다.')}}catch(err){notify('올바른 모아 백업 JSON 파일이 아닙니다.')}finally{e.target.value=''}};
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{tasks=e.newValue?validate(JSON.parse(e.newValue)):[];render();notify('다른 창의 변경 사항을 반영했습니다.')}catch(err){notify('다른 창의 데이터를 읽지 못했습니다.')}});render();
</script></body></html>
